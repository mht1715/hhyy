[tool.ruff]
# 只放 lint 配置（pytest 配置在 pytest.ini，避免两处维护）
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "volumes",
    "node_modules",
    "frontend",
    "backend/alembic/versions",
]

[tool.ruff.lint]
# 起步阶段只开「一定能修 / 一定是 bug」的规则：
# E9 语法错误、F 未使用/未定义、E4/E7 基础风格、I import 排序。
# 需要更严时再逐条加（B 规则会误报 FastAPI 的 Depends() 默认参数）。
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
