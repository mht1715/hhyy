# Alembic configuration.
# Run from the backend/ directory:  alembic upgrade head
#
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on zh-CN Windows), so non-ASCII comments break startup.
#
# The real database URL is injected by alembic/env.py from
# app.core.config.settings; the value below is only a placeholder.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://agent_user:agent_password@localhost:5432/agent_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
